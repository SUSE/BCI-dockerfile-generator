---
staging_build:
  steps:
    - branch_package:
        source_project: home:pushman:BCI:CR:16.2
        source_package: base-image
        target_project: home:pushman:BCI:CR:16.2:Staging
  filters:
    event: pull_request

refresh_staging_project:
  steps:
    - trigger_services:
        project: home:pushman:BCI:CR:16.2
        package: _project
  filters:
    event: push
    branches:
      only:
        - "16.2"


refresh_devel_BCI:
  steps:
    - trigger_services:
        project: devel:BCI:16.2
        package: base-image
  filters:
    event: push
    branches:
      only:
        - "16.2"
